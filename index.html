<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#06162d" />
  <meta name="lumina-version" content="1.5.14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LUMINA" />
  <title>LUMINA Money</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card glass">
      <div class="brand-row auth-brand">
        <div class="avatar">DV</div>
        <div>
          <div class="brand">LUMINA</div>
          <div class="subtitle">Dev by Duy Vĩnh · v1.5.14</div>
        </div>
      </div>
      <h1>Quản lý chi tiêu thông minh</h1>
      <form id="emailAuthForm" class="email-auth-form" novalidate>
        <label>
          Email
          <input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="ten@email.com" required />
        </label>
        <label>
          Mật khẩu
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" minlength="6" required />
        </label>
        <div class="auth-actions">
          <button id="loginBtn" class="primary" type="submit">Đăng nhập</button>
          <button id="signupBtn" class="secondary" type="button">Đăng ký</button>
        </div>
        <div id="authStatus" class="auth-status hidden" role="status" aria-live="polite"></div>
      </form>
      <button id="demoBtn" class="link-btn" type="button">Xem bản demo giao diện</button>
      <div id="configHint" class="config-hint hidden"></div>
    </div>
  </div>

  <main id="appShell" class="phone-shell hidden" aria-live="polite">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn avatar-btn" aria-label="Mở menu"><span id="userAvatar">DV</span></button>
      <div class="brand-block">
        <div class="brand">LUMINA</div>
        <div class="subtitle">Dev by Duy Vĩnh</div>
        <div class="version">v1.5.14</div>
      </div>
      <button id="notifyBtn" class="icon-btn" aria-label="Thông báo"><svg viewBox="0 0 24 24" class="nav-svg" aria-hidden="true"><path d="M15 17h5l-1.4-1.4a2 2 0 0 1-.6-1.4V11a6 6 0 1 0-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg><span id="notifDot" class="notif-dot hidden"></span></button>
    </header>

    <section id="screen" class="screen home-screen"></section>

    <nav class="bottom-nav" aria-label="Điều hướng chính">
      <button class="nav-item active" data-page="home"><span><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M3 10.5 12 3l9 7.5'></path><path d='M5 9.5V20h14V9.5'></path></svg></span><small>Trang chủ</small></button>
      <button class="nav-item" data-page="stats"><span><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M5 19V11'></path><path d='M12 19V5'></path><path d='M19 19v-8'></path><path d='M3 19h18'></path></svg></span><small>Thống kê</small></button>
      <button id="micBtn" class="mic-main" aria-label="Nhập bằng giọng nói"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><rect x='9' y='3' width='6' height='11' rx='3'></rect><path d='M5 11a7 7 0 0 0 14 0'></path><path d='M12 18v3'></path><path d='M8 21h8'></path></svg></button>
      <button class="nav-item" data-page="goals"><span><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><circle cx='12' cy='12' r='7'></circle><circle cx='12' cy='12' r='2.5'></circle><path d='M19 5 14.5 9.5'></path></svg></span><small>Mục tiêu</small></button>
      <button class="nav-item" data-page="wallets"><span><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M4 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4z'></path><path d='M4 9V6a2 2 0 0 1 2-2h10'></path><path d='M16 13h4'></path></svg></span><small>Ví tiền</small></button>
    </nav>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="avatar big" id="drawerAvatar">DV</div>
      <div><strong id="drawerName">Duy Vĩnh</strong><small id="drawerEmail">demo@lumina.app</small></div>
      <button id="closeDrawer" class="icon-btn">✕</button>
    </div>
    <div class="drawer-nav">
      <button data-page="home"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M3 10.5 12 3l9 7.5'></path><path d='M5 9.5V20h14V9.5'></path></svg><span>Trang chủ</span></button>
      <button data-page="transactions"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M7 7h13'></path><path d='M7 17h13'></path><path d='M4 7l2-2'></path><path d='M6 5 8 7'></path><path d='M4 17l2 2'></path><path d='M6 19 8 17'></path></svg><span>Giao dịch</span></button>
      <button data-page="stats"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M5 19V11'></path><path d='M12 19V5'></path><path d='M19 19v-8'></path><path d='M3 19h18'></path></svg><span>Thống kê</span></button>
      <button data-page="goals"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><circle cx='12' cy='12' r='7'></circle><circle cx='12' cy='12' r='2.5'></circle><path d='M19 5 14.5 9.5'></path></svg><span>Mục tiêu</span></button>
      <button data-page="loans"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><rect x='4' y='5' width='16' height='14' rx='2'></rect><path d='M8 10h8'></path><path d='M8 14h5'></path></svg><span>Khoản vay</span></button>
      <button data-page="subscriptions"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M17 1v4'></path><path d='M7 1v4'></path><rect x='3' y='5' width='18' height='16' rx='2'></rect><path d='M3 10h18'></path><path d='m8 15 2 2 4-4'></path></svg><span>Subscription</span></button>
      <button data-page="wallets"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M4 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4z'></path><path d='M4 9V6a2 2 0 0 1 2-2h10'></path><path d='M16 13h4'></path></svg><span>Ví & Tài sản</span></button>
      <button data-page="banks"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M3 10h18'></path><path d='M5 10v8'></path><path d='M10 10v8'></path><path d='M14 10v8'></path><path d='M19 10v8'></path><path d='M2 20h20'></path><path d='M12 3 3 7v2h18V7Z'></path></svg><span>Ngân hàng</span></button>
      <button data-page="settings"><svg viewBox='0 0 24 24' class='nav-svg' aria-hidden='true'><path d='M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 1 0 12 8.5z'></path><path d='M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.4 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.8a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.4a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6c.39 0 .76-.14 1.04-.4.28-.26.46-.62.46-1V3a2 2 0 1 1 4 0v.1c0 .39.18.74.46 1 .28.26.65.4 1.04.4.7 0 1.37-.27 1.87-.76l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c0 .39.14.76.4 1.04.26.28.62.46 1 .46h.1a2 2 0 1 1 0 4h-.1c-.39 0-.74.18-1 .46-.26.28-.4.65-.4 1.04Z'></path></svg><span>Cài đặt</span></button>
    </div>
    <button id="logoutBtn" class="danger ghost">Đăng xuất</button>
  </aside>
  <div id="backdrop" class="backdrop"></div>

  <section id="micOverlay" class="mic-overlay hidden">
    <div class="mic-card glass">
      <div class="mic-orb">🎙</div>
      <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <strong>Đang nghe...</strong>
      <div id="micTimer">0:00</div>
      <p id="micTranscript">Nói: “chi 45 nghìn cà phê”</p>
      <small>(Tự dừng sau 3 giây im lặng)</small>
      <button id="stopMicBtn" class="secondary">Dừng</button>
    </div>
  </section>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2 id="sheetTitle">Thêm giao dịch</h2><button id="closeSheet" class="icon-btn">✕</button></div>
    <div id="sheetBody"></div>
  </section>

  <div id="toast" class="toast"></div>
  <div id="confirmCard" class="confirm-card hidden"></div>

  <script src="./app.js"></script>
</body>
</html>
